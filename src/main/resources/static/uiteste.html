<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nice Bolos</title>
    <link rel="stylesheet" href="cardapio.css">
    <link rel="icon" href="logo.jpg">
</head>
<body>
    <div id="info">
        <h1 id="nice">Nice Bolos</h1>
    </div>
    <div id="tipo">
        <input type="button" value="Salgados">
        <input type="button" value="Bolos">
        <input type="button" value="Doces">
    </div>
    <div id="salgados" class="produtos">
        <div id="produtoGenerico" class="produto" style="display: none">
            <img src="">
            <h1></h1>
            <h2></h2>
            <div class="qtdade">
                <input type="button" value="-">
                <input type="text">
                <input type="button" value="+">
            </div>
        </div>
    </div>
    <div id="doces" class="produtosNone"></div>
    <div id="bolos" class="produtosNone"></div>

    <input type="button" class="button" id="continuar" value="Continuar">
    <div id="fog"></div>
    <div id="popup">
        <h1 id="confirmacao">Confirmação do pedido</h1>
        <input type="button" id="fechar" value="X">
        <form id="confirmaForm">
            <div id="campos">
                <label for="tel">Numero do WhatsApp</label>
                <input type="tel" id="tel" name="telefone" placeholder="Telefone">
            </div>
            <input type="submit" class="button" id="enviar" value="Enviar">
        </form>
        <p id="status" style="display: none">Sucesso, enviamos uma mensagem no seu WhatsApp!</p>
    </div>
</body>
<script src="cardapio.js"></script>
</html>
